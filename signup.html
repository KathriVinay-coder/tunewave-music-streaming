<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - Spotify</title>
    <link rel="icon" href="logo.png"/>
    <link rel="stylesheet" href="css/auth.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-header">
        <a href="index.html">
            <img src="logo.png" alt="Spotify Logo" class="auth-logo">
        </a>
    </div>

    <div class="auth-card">
        <h1 class="auth-title">Sign up to start listening</h1>

        <!-- Status / Error message alert box -->
        <div id="auth-alert" class="auth-alert"></div>

        <form id="signup-form">
            <div class="form-group">
                <label for="name">What's your name?</label>
                <input type="text" id="name" name="name" placeholder="Enter your profile name" required autocomplete="name">
            </div>

            <div class="form-group">
                <label for="email">What's your email?</label>
                <input type="email" id="email" name="email" placeholder="name@domain.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Create a password</label>
                <input type="password" id="password" name="password" placeholder="At least 6 characters" required autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm your password</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Repeat password" required autocomplete="new-password">
            </div>

            <button type="submit" id="submit-btn" class="auth-btn">Sign Up</button>
        </form>

        <div class="auth-divider"></div>

        <div class="auth-footer">
            <span>Already have an account?</span>
            <a href="signin.html">Log in here</a>
        </div>
    </div>

    <a href="index.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Back to Web Player
    </a>

    <script src="js/auth.js"></script>
</body>
</html>
